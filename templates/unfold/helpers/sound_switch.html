<div class="border-b border-base-200 flex flex-col gap-1.5 px-3 py-2 text-xs dark:border-base-700">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5 font-semibold text-font-important-light dark:text-font-important-dark select-none">
            <span class="material-symbols-outlined text-[17px] text-primary-600 dark:text-primary-500" id="soundStatusIcon">volume_up</span>
            <span>Səsli Bildiriş</span>
        </div>
        <button type="button" id="toggleSoundBtn" class="cursor-pointer font-bold px-2 py-0.5 rounded text-[11px] transition-colors bg-emerald-100 text-emerald-800 hover:bg-emerald-200 dark:bg-emerald-950/60 dark:text-emerald-300">
            Aktiv
        </button>
    </div>
    <div class="flex items-center gap-1.5 pt-0.5">
        <button type="button" id="testElanSoundQuickBtn" class="grow flex items-center justify-center gap-1 py-1 px-1.5 rounded text-[11px] font-medium bg-base-100 hover:bg-base-200 text-base-700 dark:bg-base-700 dark:hover:bg-base-600 dark:text-base-200 transition-colors" title="Yeni Elan səsini yoxla">
            <span class="material-symbols-outlined text-[13px] text-emerald-600 dark:text-emerald-400">notifications</span>
            <span>Elan</span>
        </button>
        <button type="button" id="testOdenisSoundQuickBtn" class="grow flex items-center justify-center gap-1 py-1 px-1.5 rounded text-[11px] font-medium bg-base-100 hover:bg-base-200 text-base-700 dark:bg-base-700 dark:hover:bg-base-600 dark:text-base-200 transition-colors" title="Yeni Ödəniş səsini yoxla">
            <span class="material-symbols-outlined text-[13px] text-amber-600 dark:text-amber-400">payments</span>
            <span>Ödəniş</span>
        </button>
    </div>
</div>
