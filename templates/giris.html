{% extends 'base.html' %}
{% block title %}Giriş — Prousta.az{% endblock %}
{% block style %}
<style>
.auth-wrap{max-width:420px;margin:60px auto;padding:0 20px}
.auth-box{background:var(--white);border-radius:var(--r);border:1px solid var(--border);padding:36px}
.auth-box h2{font-size:22px;font-weight:700;margin-bottom:24px;text-align:center}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r);font-size:15px;transition:.2s}
.field input:focus{border-color:var(--p);outline:none}
.forgot{text-align:right;font-size:12px;margin-top:4px}
.forgot a{color:var(--p)}
.auth-btn{width:100%;padding:13px;background:var(--p);color:#fff;border-radius:var(--r);font-size:15px;font-weight:700;margin-top:8px;border:none;cursor:pointer}
.auth-btn:hover{background:var(--pd)}
.divider{text-align:center;margin:16px 0;color:var(--muted);font-size:13px;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--border)}
.divider::before{left:0}.divider::after{right:0}
.google-btn{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:14px;font-weight:600;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s}
.google-btn:hover{border-color:#4285f4;background:#f8faff}
.auth-link{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
.auth-link a{color:var(--p);font-weight:600}
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <h2>Hesaba daxil ol</h2>
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label>İstifadəçi adı</label>
        <input name="username" required autocomplete="username">
      </div>
      <div class="field">
        <label>Şifrə</label>
        <input name="password" type="password" required autocomplete="current-password">
        <div class="forgot"><a href="/sifre-unutdum/">Şifrəni unutmusunuz?</a></div>
      </div>
      <button class="auth-btn" type="submit">Daxil ol</button>
    </form>
    <div class="divider">və ya</div>
    <a href="{% url 'social:begin' 'google-oauth2' %}" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google ilə daxil ol
    </a>
    <div class="auth-link">Hesabın yoxdur? <a href="/qeydiyyat/">Qeydiyyat</a></div>
  </div>
</div>
{% endblock %}
