<title>{{ seo.title }}</title>
<meta name="description" content="{{ seo.description }}">
<meta name="robots" content="{{ seo.robots }}">
<meta name="author" content="Prousta.az">
<link rel="canonical" href="{{ seo.canonical }}">
<link rel="alternate" hreflang="az" href="{{ seo.canonical }}">
<link rel="alternate" hreflang="x-default" href="{{ seo.canonical }}">
<link rel="help" type="text/plain" href="https://prousta.az/llms.txt" title="Sayt haqqında məlumat və mənbələr">
{% if GOOGLE_SITE_VERIFICATION %}<meta name="google-site-verification" content="{{ GOOGLE_SITE_VERIFICATION }}">{% endif %}
{% if YANDEX_VERIFICATION %}<meta name="yandex-verification" content="{{ YANDEX_VERIFICATION }}">{% endif %}
<meta property="og:type" content="{{ seo.og_type }}">
<meta property="og:site_name" content="Prousta.az">
<meta property="og:locale" content="az_AZ">
<meta property="og:title" content="{{ seo.title }}">
<meta property="og:description" content="{{ seo.description }}">
<meta property="og:url" content="{{ seo.canonical }}">
<meta property="og:image" content="{{ seo.image }}">
<meta property="og:image:alt" content="{{ seo.title }}">
{% if seo.default_image %}<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">{% endif %}
{% if seo.published %}<meta property="article:published_time" content="{{ seo.published|date:'c' }}">{% endif %}
{% if seo.modified %}<meta property="article:modified_time" content="{{ seo.modified|date:'c' }}">{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo.title }}">
<meta name="twitter:description" content="{{ seo.description }}">
<meta name="twitter:image" content="{{ seo.image }}">
<meta name="twitter:image:alt" content="{{ seo.title }}">
{% if seo.schema %}<script type="application/ld+json">{{ seo.schema|safe }}</script>{% endif %}
