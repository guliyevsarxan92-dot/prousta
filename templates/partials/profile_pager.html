{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="{{ label }}">
  {% if page.has_previous %}<a href="?{{ key }}={{ page.previous_page_number }}{% if tab %}#{{ tab }}{% endif %}">{% if is_ru %}Назад{% else %}Əvvəlki{% endif %}</a>{% endif %}
  <span>{{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{{ key }}={{ page.next_page_number }}{% if tab %}#{{ tab }}{% endif %}">{% if is_ru %}Далее{% else %}Sonrakı{% endif %}</a>{% endif %}
</nav>
{% endif %}
