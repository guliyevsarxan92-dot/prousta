name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py check --settings=prousta.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=prousta.test_settings
      - run: python manage.py test core --settings=prousta.test_settings --noinput
      - name: Start isolated PostgreSQL
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base = Path('/tmp/prousta-isolated-pg-ci')
          base.mkdir()
          (base / 'socket').mkdir()
          binaries = Path(subprocess.check_output(['pg_config', '--bindir'], text=True).strip())
          subprocess.run([str(binaries / 'initdb'), '-D', str(base / 'data'), '-A', 'trust', '--no-locale', '-E', 'UTF8'], check=True)
          subprocess.run([str(binaries / 'pg_ctl'), '-D', str(base / 'data'), '-l', str(base / 'server.log'), '-o', f"-k {base / 'socket'} -p 55439 -c listen_addresses=''", '-w', 'start'], check=True)
          PY
      - name: PostgreSQL integration and concurrency tests
        env:
          TEST_DATABASE_URL: postgresql://%2Ftmp%2Fprousta-isolated-pg-ci%2Fsocket:55439/postgres
        run: python manage.py test core --settings=prousta.test_settings --noinput
      - name: Stop isolated PostgreSQL
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base = Path('/tmp/prousta-isolated-pg-ci')
          if (base / 'data' / 'postmaster.pid').exists():
              binaries = Path(subprocess.check_output(['pg_config', '--bindir'], text=True).strip())
              subprocess.run([str(binaries / 'pg_ctl'), '-D', str(base / 'data'), '-m', 'fast', '-w', 'stop'], check=True)
          PY
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile_app
      - run: flutter analyze --fatal-infos
        working-directory: mobile_app
      - run: flutter test
        working-directory: mobile_app
